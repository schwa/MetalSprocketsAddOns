# Buildkite pipeline for MetalSprocketsAddOns.
#
# Runs on a self-hosted Mac with a Metal 4 GPU, so the GPU tests that GitHub Actions skips run here.
# The agent Mac and queue are shared with MetalSprockets; agent setup is in its Documentation/Buildkite.md.

# The cluster routes jobs by queue. Every agent on this queue must be a Mac with a Metal 4 GPU.
agents:
  queue: "default-queue"

steps:
  - label: ":swift: Lint"
    key: "lint"
    command: "swiftlint --strict"

  - label: ":metal: Test (macOS, API Validation)"
    key: "test"
    # One GPU test run at a time on an agent, so parallel builds don't compete for the GPU.
    concurrency: 1
    concurrency_group: "metalsprocketsaddons/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    command:
      - "swift build -Xswiftc -warnings-as-errors --disable-sandbox"
      - "swift test -Xswiftc -warnings-as-errors --disable-sandbox"

  - label: ":swift: Build (release)"
    key: "build-release"
    # Optimized builds can fail where Debug passes (MetalSprockets #460).
    command: "swift build -c release -Xswiftc -warnings-as-errors --disable-sandbox"

  - label: ":metal: Demo scene tests (macOS, API Validation)"
    key: "demo-tests"
    # Golden-image tests of every Examples demo (#59).
    concurrency: 1
    concurrency_group: "metalsprocketsaddons/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    command: "swift test --disable-sandbox --package-path Examples/MetalSprocketsAddOnsExamples/Packages/MetalSprocketsAddOnsExamplesSupport"

  - label: ":hammer: Example ({{matrix.destination}}, {{matrix.configuration}})"
    key: "example"
    matrix:
      setup:
        destination:
          - "platform=macOS"
          - "generic/platform=iOS"
          - "generic/platform=xrOS"
        configuration:
          - "Debug"
          - "Release"
    command: >-
      xcodebuild build
      -project Examples/MetalSprocketsAddOnsExamples/MetalSprocketsAddOnsExamples.xcodeproj
      -scheme MetalSprocketsAddOnsExamples
      -configuration {{matrix.configuration}}
      -destination '{{matrix.destination}}'
      -skipPackagePluginValidation
      -skipMacroValidation
      CODE_SIGNING_ALLOWED=NO
